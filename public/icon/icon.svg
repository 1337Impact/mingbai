<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- A maneki-neko: beckoning paw, calico patches, red collar with a bell, and a gold koban stamped 明. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4bb0f0"/>
      <stop offset="1" stop-color="#1a63b8"/>
    </linearGradient>
    <clipPath id="tile"><rect width="128" height="128" rx="29"/></clipPath>
    <clipPath id="head"><ellipse cx="58" cy="52" rx="33" ry="27"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="128" height="128" fill="url(#sky)"/>
    <!-- body -->
    <ellipse cx="60" cy="106" rx="33" ry="34" fill="#fff"/>
    <!-- beckoning arm -->
    <path d="M84 98q23-4 23-30V42" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round"/>
    <path d="M104 35v6M110 35v6" stroke="#c3cfdf" stroke-width="2.500" stroke-linecap="round"/>
    <!-- ears -->
    <g stroke-linejoin="round">
      <path d="M29 42 34 12 56 29z" fill="#fff" stroke="#fff" stroke-width="5"/>
      <path d="M87 42 82 12 60 29z" fill="#fff" stroke="#fff" stroke-width="5"/>
      <path d="M36 34 38 21 48 29z" fill="#e0402f" stroke="#e0402f" stroke-width="2.500"/>
      <path d="M80 34 78 21 68 29z" fill="#e0402f" stroke="#e0402f" stroke-width="2.500"/>
    </g>
    <!-- head with calico patches -->
    <ellipse cx="58" cy="52" rx="33" ry="27" fill="#fff"/>
    <g clip-path="url(#head)">
      <circle cx="30" cy="30" r="17" fill="#f6a23c"/>
      <circle cx="84" cy="27" r="13" fill="#3a3f4b"/>
    </g>
    <!-- face -->
    <path d="M38 52q7-9 14 0M64 52q7-9 14 0" fill="none" stroke="#2a2f3a" stroke-width="4.500" stroke-linecap="round"/>
    <circle cx="33" cy="62" r="6.500" fill="#ff8f9c" opacity=".75"/>
    <circle cx="83" cy="62" r="6.500" fill="#ff8f9c" opacity=".75"/>
    <path d="M54.500 58h7l-3.500 4.500z" fill="#ff6b81" stroke="#ff6b81" stroke-width="2" stroke-linejoin="round"/>
    <path d="M50 65q4 6 8 0q4 6 8 0" fill="none" stroke="#2a2f3a" stroke-width="3.200" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M17 54l13 3M16 64l14-1M99 54l-13 3M100 64l-14-1" stroke="#2a2f3a" stroke-width="2.200" stroke-linecap="round"/>
    <!-- collar and bell -->
    <path d="M33 71q25 15 50 0v8q-25 14-50 0z" fill="#e0402f"/>
    <circle cx="58" cy="83" r="6.500" fill="#ffd45e" stroke="#e9a91f" stroke-width="1.800"/>
    <path d="M58 83v4" stroke="#b9791a" stroke-width="2" stroke-linecap="round"/>
    <!-- koban with 明 -->
    <g transform="rotate(-6 61 108)">
      <ellipse cx="61" cy="110" rx="16" ry="19" fill="#ffd45e" stroke="#e9a91f" stroke-width="2.500"/>
      <g transform="translate(62 110) scale(.24) translate(-64 -65)" fill="none" stroke="#a5630e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="39" cy="60" r="15.500"/>
        <circle cx="39" cy="60" r="5" fill="#a5630e" stroke="none"/>
        <path d="M72 28v42q0 21-15 32M72 28h32v64q0 10-10 10h-5M72 50h32M72 70h32"/>
      </g>
    </g>
    <!-- the paw holding the coin -->
    <ellipse cx="40" cy="113" rx="7.500" ry="6.500" fill="#fff" stroke="#c3cfdf" stroke-width="2"/>
  </g>
</svg>
